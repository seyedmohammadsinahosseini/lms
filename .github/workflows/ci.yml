name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: PHP, schema, migration and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install PHP extensions and clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql php-mbstring mariadb-client jq curl shellcheck
      - name: PHP and shell quality
        run: |
          find backend tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          bash -n tools/*.sh
          shellcheck tools/*.sh
      - name: Import fresh schema and security schema
        env:
          MYSQL_PWD: root
        run: |
          mariadb -h127.0.0.1 -uroot -e "CREATE DATABASE lms_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE lms_security CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER 'lms_ci'@'%' IDENTIFIED BY 'lms_ci'; GRANT ALL ON lms_test.* TO 'lms_ci'@'%'; GRANT ALL ON lms_security.* TO 'lms_ci'@'%'; FLUSH PRIVILEGES;"
          mariadb -h127.0.0.1 -uroot lms_test < backend/schema.sql
          mariadb -h127.0.0.1 -uroot lms_security < backend/schema.sql
      - name: API lifecycle tests
        env:
          LMS_DB_HOST: 127.0.0.1
          LMS_DB_NAME: lms_test
          LMS_DB_USER: lms_ci
          LMS_DB_PASS: lms_ci
        run: bash tools/api_test.sh
      - name: API security tests
        env:
          LMS_DB_HOST: 127.0.0.1
          LMS_DB_NAME: lms_security
          LMS_DB_USER: lms_ci
          LMS_DB_PASS: lms_ci
        run: bash tools/api_security_test.sh
      - name: Upgrade migration from baseline schema
        env:
          MYSQL_PWD: root
        run: |
          mariadb -h127.0.0.1 -uroot -e 'DROP DATABASE IF EXISTS lms; CREATE DATABASE lms CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          git show c89f74a:backend/schema.sql | sed -E '/^CREATE DATABASE /d; /^USE /d' | mariadb -h127.0.0.1 -uroot lms
          mariadb -h127.0.0.1 -uroot lms < backend/migrations/2026-10-02_full_remediation.sql
          test "$(mariadb -N -h127.0.0.1 -uroot -e "SELECT COUNT(*) FROM lms.schema_migrations WHERE version='2026-10-02_full_remediation'")" = 1
      - name: Validate local seed against fresh schema
        env:
          MYSQL_PWD: root
        run: |
          mariadb -h127.0.0.1 -uroot -e 'CREATE DATABASE lms_seed CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          mariadb -h127.0.0.1 -uroot lms_seed < backend/schema.sql
          mariadb -h127.0.0.1 -uroot lms_seed < tools/demo_seed.sql
          test "$(mariadb -N -h127.0.0.1 -uroot -e 'SELECT COUNT(*) FROM lms_seed.users')" = 2

  flutter:
    name: Flutter analysis, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - name: Dependencies
        working-directory: lms_flutter
        run: flutter pub get
      - name: Static analysis
        working-directory: lms_flutter
        run: flutter analyze
      - name: Unit and widget tests
        working-directory: lms_flutter
        run: flutter test
      - name: Release web build
        working-directory: lms_flutter
        run: >-
          flutter build web --release --no-wasm-dry-run
          --dart-define=LMS_API_BASE=https://portfolio.example.test/api/v1
          --dart-define=LMS_APP_MODE=portfolio_demo
      - name: Debug Android build
        working-directory: lms_flutter
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: >-
          flutter build apk --debug
          --dart-define=LMS_API_BASE=https://portfolio.example.test/api/v1
          --dart-define=LMS_APP_MODE=development
      - uses: actions/upload-artifact@v4
        with:
          name: lms-builds
          path: |
            lms_flutter/build/web
            lms_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  browser-smoke:
    name: Browser runtime smoke test
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: lms-builds
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install browser test dependencies
        working-directory: tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Serve web build
        run: |
          python3 -m http.server 8080 --directory artifacts/web > /tmp/lms-web.log 2>&1 &
          echo $! > /tmp/lms-web.pid
      - name: Runtime smoke test
        env:
          APP_URL: http://127.0.0.1:8080/
        run: node tools/web_smoke_test.js artifacts/web-smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: artifacts/web-smoke.png
          if-no-files-found: warn
