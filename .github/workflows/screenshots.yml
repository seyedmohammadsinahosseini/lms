name: Portfolio screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: lms_flutter
        run: flutter pub get

      - name: Build deterministic showcase
        working-directory: lms_flutter
        run: |
          flutter build web --release --no-wasm-dry-run \
            --target=lib/main_showcase.dart \
            --dart-define=LMS_APP_MODE=development
          mv build/web build/showcase-web

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install browser tooling
        working-directory: tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Serve preview
        run: |
          python3 -m http.server 8081 --directory lms_flutter/build/showcase-web >/tmp/lms-showcase.log 2>&1 &

      - name: Capture actual Flutter screens
        env:
          LMS_PRODUCTION_PREVIEW: http://127.0.0.1:8081/?role=anonymous
          LMS_SHOWCASE_PREVIEW: http://127.0.0.1:8081/
        run: node tools/capture_portfolio_screenshots.js

      - uses: actions/upload-artifact@v7
        with:
          name: lms-portfolio-screenshots
          path: |
            docs/images/login-mobile.png
            docs/images/teacher-dashboard.png
            docs/images/student-dashboard.png
            docs/images/class-workspace.png
          retention-days: 14
