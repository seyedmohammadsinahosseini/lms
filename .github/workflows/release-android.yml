name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: Production HTTPS URL ending in /api/v1
        required: true
        type: string
      application_id:
        description: Unique application id (for example io.github.owner.lms)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LMS_API_BASE: ${{ inputs.api_base || secrets.LMS_API_BASE }}
      LMS_APPLICATION_ID: ${{ inputs.application_id || secrets.LMS_APPLICATION_ID }}
      LMS_KEY_ALIAS: ${{ secrets.LMS_KEY_ALIAS }}
      LMS_STORE_PASSWORD: ${{ secrets.LMS_STORE_PASSWORD }}
      LMS_KEY_PASSWORD: ${{ secrets.LMS_KEY_PASSWORD }}
      LMS_KEYSTORE: ${{ github.workspace }}/.signing/lms-release.jks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - name: Restore signing key
        env:
          LMS_KEYSTORE_BASE64: ${{ secrets.LMS_KEYSTORE_BASE64 }}
        run: |
          test -n "$LMS_KEYSTORE_BASE64"
          mkdir -p .signing
          printf '%s' "$LMS_KEYSTORE_BASE64" | base64 --decode > "$LMS_KEYSTORE"
          chmod 600 "$LMS_KEYSTORE"
      - name: Build, test and sign universal APK
        run: bash tools/build_signed_apk.sh
      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs releases/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: signed-universal-apk
          path: |
            releases/*.apk
            releases/*.sha256
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" releases/* --generate-notes --verify-tag
