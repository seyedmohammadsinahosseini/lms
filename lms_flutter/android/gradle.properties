# Jitsi's Android graph needs more than the Gradle default while D8 merges dex.
# Three GiB stays comfortably inside GitHub's hosted-runner memory limit.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# Compatibility flags retained for current Flutter/AGP templates.
android.builtInKotlin=false
android.newDsl=false
