<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">LMS architecture</title>
  <desc id="desc">Flutter Android and Web clients connect to a versioned PHP API backed by MySQL, private storage, demo isolation, and JaaS live sessions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".30"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font:700 28px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .subtitle{font:500 17px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .small{font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .label{font:700 16px Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0;letter-spacing:.08em}
      .line{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2;stroke-dasharray:8 9;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="title">LMS · production-minded portfolio architecture</text>
  <text x="70" y="105" class="subtitle">One contract across phone-first Android and responsive Web</text>

  <text x="72" y="164" class="label">CLIENTS</text>
  <g filter="url(#shadow)">
    <rect x="70" y="190" width="270" height="178" rx="22" fill="url(#client)"/>
    <rect x="365" y="190" width="270" height="178" rx="22" fill="url(#client)"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="161" y="219" width="88" height="116" rx="14" opacity=".95"/>
    <path d="M195 315h20"/>
    <rect x="414" y="226" width="172" height="103" rx="10" opacity=".95"/>
    <path d="M396 341h208M479 329l-11 12M521 329l11 12"/>
  </g>
  <text x="205" y="397" text-anchor="middle" class="title">Android</text>
  <text x="205" y="426" text-anchor="middle" class="small">secure bearer tokens</text>
  <text x="500" y="397" text-anchor="middle" class="title">Flutter Web</text>
  <text x="500" y="426" text-anchor="middle" class="small">HttpOnly cookie + CSRF</text>

  <path d="M340 279 C 665 279, 625 279, 735 279" class="line"/>
  <path d="M635 279 C 680 279, 690 279, 735 279" class="line"/>
  <rect x="525" y="235" width="180" height="32" rx="16" fill="#1e293b" stroke="#475569"/>
  <text x="615" y="257" text-anchor="middle" class="small">HTTPS · JSON · /api/v1</text>

  <text x="742" y="164" class="label">APPLICATION</text>
  <g filter="url(#shadow)">
    <rect x="735" y="190" width="300" height="282" rx="22" fill="url(#api)"/>
  </g>
  <text x="885" y="242" text-anchor="middle" class="title">PHP 8 REST API</text>
  <line x1="780" y1="261" x2="990" y2="261" stroke="#d8b4fe" stroke-opacity=".6"/>
  <text x="775" y="301" class="subtitle">✓ authentication &amp; roles</text>
  <text x="775" y="338" class="subtitle">✓ lifecycle transactions</text>
  <text x="775" y="375" class="subtitle">✓ rate limits &amp; audit</text>
  <text x="775" y="412" class="subtitle">✓ signed private files</text>
  <text x="775" y="449" class="subtitle">✓ versioned contracts</text>

  <text x="1094" y="164" class="label">DATA &amp; SERVICES</text>
  <g filter="url(#shadow)">
    <rect x="1088" y="190" width="242" height="120" rx="20" fill="url(#data)"/>
    <rect x="1088" y="330" width="242" height="120" rx="20" fill="#334155"/>
    <rect x="1088" y="470" width="242" height="120" rx="20" fill="#4338ca"/>
  </g>
  <text x="1209" y="236" text-anchor="middle" class="title">MySQL 8</text>
  <text x="1209" y="267" text-anchor="middle" class="small">26-table relational model</text>
  <text x="1209" y="291" text-anchor="middle" class="small">InnoDB · utf8mb4</text>
  <text x="1209" y="376" text-anchor="middle" class="title">Private storage</text>
  <text x="1209" y="407" text-anchor="middle" class="small">outside document root</text>
  <text x="1209" y="431" text-anchor="middle" class="small">MIME + HMAC authorization</text>
  <text x="1209" y="516" text-anchor="middle" class="title">Jitsi / JaaS</text>
  <text x="1209" y="547" text-anchor="middle" class="small">secure Live classrooms</text>
  <text x="1209" y="571" text-anchor="middle" class="small">owner-managed credentials</text>

  <path d="M1035 250 C 1060 250, 1065 250, 1088 250" class="line"/>
  <path d="M1035 350 C 1060 350, 1065 390, 1088 390" class="line"/>
  <path d="M1035 420 C 1065 420, 1058 530, 1088 530" class="dash"/>

  <g filter="url(#shadow)">
    <rect x="70" y="522" width="965" height="164" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/>
  </g>
  <text x="108" y="570" class="title">Isolated portfolio demo</text>
  <text x="108" y="610" class="subtitle">Synthetic teacher + student · per-visitor sandbox · two-hour expiry</text>
  <text x="108" y="648" class="subtitle">Automatic cleanup · no shared credentials · safe for public evaluation</text>
  <g transform="translate(830 551)" fill="none" stroke="#a78bfa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 36a36 36 0 1 0 12-27"/>
    <path d="M12 0v22h22"/>
    <path d="M57 56l24 24"/>
    <circle cx="94" cy="93" r="20"/>
  </g>
</svg>
